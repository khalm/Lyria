<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#121212">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <title>Lyria</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1c1c1e;
      --text: #f0f0f0;
      --subtext: #8e8e93;
      --accent: #bb86fc;
      --accent-hover: #9a67ea;
      --border: #2c2c2e;
      --input-bg: #262628;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      padding-bottom: 40px;
      line-height: 1.5;
    }
    header {
      margin-bottom: 16px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
    }
    p.subtitle {
      font-size: 0.85rem;
      color: var(--subtext);
    }
    details {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }
    summary {
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--accent);
    }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      margin-top: 12px;
      margin-bottom: 6px;
      color: var(--subtext);
    }
    input[type="password"],
    input[type="text"],
    textarea {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: #fff;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      -webkit-user-select: text;
      user-select: text;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    .key-row {
      display: flex;
      gap: 8px;
    }
    .action-btn {
      width: auto;
      margin-top: 0;
      padding: 10px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      background: #2a2a2c;
      color: var(--accent);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .action-btn:active {
      background: #333336;
    }
    .main-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
    }
    button.primary-btn {
      width: 100%;
      background-color: var(--accent);
      color: #121212;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 14px;
    }
    button.primary-btn:active {
      background-color: var(--accent-hover);
    }
    button:disabled {
      background-color: #333 !important;
      color: #666 !important;
      cursor: not-allowed;
    }
    #outputContainer {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
      display: none;
      position: relative;
    }
    .output-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      gap: 8px;
    }
    .output-header h2 {
      font-size: 1rem;
      color: var(--subtext);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 65%;
    }
    .header-btns {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }
    .header-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--accent);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .header-btn:active {
      background: #2a2a2c;
    }
    .refine-box {
      margin-top: 12px;
      margin-bottom: 16px;
      padding: 12px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .refine-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      flex-wrap: wrap;
    }
    .refine-btn {
      flex: 1;
      min-width: 120px;
      background: #2a2a2c;
      border: 1px solid var(--border);
      color: var(--accent);
      padding: 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .refine-btn:active {
      background: #38383c;
    }
    .save-btn {
      color: #4ade80;
      border-color: #2e6040;
    }

    /* Fixed floating HUD toolbar so it never scrolls away */
    .editor-wrapper {
      position: relative;
      margin-top: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #171719;
    }
    .editor-floating-bar {
      position: fixed;
      top: 16px;
      right: 16px;
      display: none;
      gap: 8px;
      z-index: 100;
      background: rgba(28, 28, 30, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 4px 6px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #2a2a2c;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e0e0e0;
      padding: 6px 12px;
      border-radius: 18px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .pill-btn:active {
      transform: scale(0.96);
      background: #38383c;
    }
    .pill-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none;
    }
    .pill-btn.copied {
      color: #4ade80;
      border-color: rgba(74, 222, 128, 0.4);
      background: rgba(20, 45, 30, 0.9);
    }
    .pill-btn svg {
      width: 13px;
      height: 13px;
      fill: currentColor;
    }
    #outputText {
      width: 100%;
      min-height: 480px;
      background: transparent;
      border: none;
      color: #fff;
      padding: 14px;
      border-radius: 8px;
      font-size: 0.95rem;
      line-height: 1.6;
      resize: vertical;
      font-family: inherit;
      white-space: pre-wrap;
      -webkit-user-select: text;
      user-select: text;
      outline: none;
    }
    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--input-bg);
      border: 1px solid var(--border);
      padding: 10px 12px;
      border-radius: 8px;
      margin-top: 8px;
      cursor: pointer;
    }
    .history-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 75%;
    }
    .delete-item-btn {
      background: transparent;
      border: none;
      color: #ff5c5c;
      font-size: 0.85rem;
      padding: 4px 8px;
      cursor: pointer;
    }

    #saveModalOverlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 20px;
    }
    .modal-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    .modal-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
    }
    .modal-desc {
      font-size: 0.85rem;
      color: var(--subtext);
      margin-bottom: 18px;
    }
    .modal-btn-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .modal-btn {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      border: none;
      margin-top: 0;
      text-align: center;
    }
    .btn-new-version {
      background: var(--accent);
      color: #121212;
    }
    .btn-overwrite {
      background: #2a2a2c;
      border: 1px solid var(--border);
      color: #ffaa5a;
    }
    .btn-cancel {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--subtext);
      font-weight: 600;
    }

    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(30, 30, 30, 0.96);
      border: 1px solid #444;
      color: #fff;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 0.85rem;
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
      z-index: 300;
      text-align: center;
      max-width: 85%;
    }
  </style>
</head>
<body>

  <header>
    <h1>Lyria</h1>
    <p class="subtitle">AI Lyric Assistant trained on your voice</p>
  </header>

  <!-- 1. Setup & Style References (Top) -->
  <details id="settingsDetails" open>
    <summary>⚙️ Setup & Style References</summary>
    
    <label for="apiKey">Gemini API Key</label>
    <div class="key-row">
      <input type="password" id="apiKey" placeholder="AI Studio Key">
      <button type="button" id="testKeyBtn" class="action-btn" onclick="testApiKey()">Test</button>
    </div>

    <label for="referenceLyrics">Reference Songs / Past Lyrics (Raw Sources)</label>
    
    <div style="margin-bottom: 8px;">
      <input type="file" id="fileInput" accept="application/pdf, text/plain" multiple style="display: none;" onchange="handleFileUpload(event)">
      <button type="button" class="action-btn" style="width: 100%;" onclick="document.getElementById('fileInput').click()">
        📄 Import Multiple PDFs / Text Files
      </button>
    </div>

    <textarea id="referenceLyrics" rows="8" placeholder="Paste full songs, verses, or import multiple PDFs/text files."></textarea>
  </details>

  <!-- 2. Saved Songs Library (Second) -->
  <details id="historyDetails">
    <summary>📚 Saved Songs Library</summary>
    <div id="songsListContainer" style="margin-top: 10px;">
      <p id="emptyHistoryMsg" style="font-size: 0.85rem; color: var(--subtext);">No saved songs yet.</p>
    </div>
  </details>

  <!-- Input Area -->
  <div class="main-card">
    <label for="starterLine" style="margin-top: 0;">Opening Line or Theme (Song Title)</label>
    <input type="text" id="starterLine" placeholder="e.g. Iron string buzzing on the twelfth fret">

    <button id="generateBtn" class="primary-btn" onclick="generateLyrics()">Generate Original Song</button>
  </div>

  <!-- Persistent floating action pill that stays fixed regardless of scrolling -->
  <div id="editorFloatingBar" class="editor-floating-bar">
    <button type="button" id="editorUndoBtn" class="pill-btn" onclick="triggerUndo()" disabled>
      <svg viewBox="0 0 24 24">
        <path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/>
      </svg>
      <span id="undoCountText">Undo</span>
    </button>

    <button type="button" id="copyPillBtn" class="pill-btn" onclick="copyLyrics()">
      <svg id="copyIcon" viewBox="0 0 24 24">
        <path d="M16 1H4C2.9 1 2 1.9 2 3V17H4V3H16V1ZM19 5H8C6.9 5 6 5.9 6 7V21C6 22.1 6.9 23 8 23H19C20.1 23 21 22.1 21 21V7C21 5.9 20.1 5 19 5ZM19 21H8V7H19V21Z"/>
      </svg>
      <span id="copyPillText">Copy</span>
    </button>
  </div>

  <!-- Output Area -->
  <div id="outputContainer">
    <div class="output-header">
      <h2 id="currentSongTitle">Generated Lyrics</h2>
      <div class="header-btns">
        <button class="header-btn" onclick="selectAllLyrics()">📋 Select All</button>
      </div>
    </div>

    <!-- Refine & Action Controls -->
    <div class="refine-box">
      <span style="font-size: 0.8rem; color: var(--subtext); font-weight: 600;">Edit & Actions:</span>
      <div class="refine-actions">
        <button type="button" id="tightenBtn" class="refine-btn" onclick="tightenLyrics()">✂️ Tighten Lines</button>
        <button type="button" id="saveStateBtn" class="refine-btn save-btn" onclick="openSaveModal()">💾 Save</button>
      </div>
    </div>

    <!-- Editable Lyric Area -->
    <div class="editor-wrapper">
      <textarea id="outputText" placeholder="Lyrics will appear here... you can edit them directly."></textarea>
    </div>
  </div>

  <!-- Explicit Save Modal Dialog -->
  <div id="saveModalOverlay">
    <div class="modal-box">
      <div class="modal-title" id="modalSongName">Save Song</div>
      <div class="modal-desc">This song already exists in your library. How would you like to save your edits?</div>
      <div class="modal-btn-stack">
        <button type="button" class="modal-btn btn-new-version" onclick="confirmSaveChoice('new')">➕ New Version</button>
        <button type="button" class="modal-btn btn-overwrite" onclick="confirmSaveChoice('overwrite')">덮 Overwrite</button>
        <button type="button" class="modal-btn btn-cancel" onclick="closeSaveModal()">Cancel</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    const apiKeyInput = document.getElementById('apiKey');
    const refLyricsInput = document.getElementById('referenceLyrics');
    const starterLineInput = document.getElementById('starterLine');
    const outputContainer = document.getElementById('outputContainer');
    const outputText = document.getElementById('outputText');
    const currentSongTitle = document.getElementById('currentSongTitle');
    const generateBtn = document.getElementById('generateBtn');
    const tightenBtn = document.getElementById('tightenBtn');
    const editorUndoBtn = document.getElementById('editorUndoBtn');
    const undoCountText = document.getElementById('undoCountText');
    const testKeyBtn = document.getElementById('testKeyBtn');
    const settingsDetails = document.getElementById('settingsDetails');
    const songsListContainer = document.getElementById('songsListContainer');
    const copyPillBtn = document.getElementById('copyPillBtn');
    const copyPillText = document.getElementById('copyPillText');
    const editorFloatingBar = document.getElementById('editorFloatingBar');
    const saveModalOverlay = document.getElementById('saveModalOverlay');
    const modalSongName = document.getElementById('modalSongName');
    const toast = document.getElementById('toast');

    // 20-Step Granular Undo System
    const MAX_UNDO_STEPS = 20;
    let undoStack = [];
    let currentCommittedText = '';
    let typingTimer = null;
    let isReverting = false;

    function resetHistory(initialText) {
      undoStack = [];
      currentCommittedText = initialText || '';
      updateUndoButton();
    }

    function pushToUndoStack(text) {
      if (text === null || text === undefined) return;
      if (undoStack.length > 0 && undoStack[undoStack.length - 1] === text) return;
      
      undoStack.push(text);
      if (undoStack.length > MAX_UNDO_STEPS) {
        undoStack.shift();
      }
      updateUndoButton();
    }

    function updateUndoButton() {
      if (undoStack.length > 0) {
        editorUndoBtn.removeAttribute('disabled');
        undoCountText.textContent = `Undo (${undoStack.length})`;
      } else {
        editorUndoBtn.setAttribute('disabled', 'true');
        undoCountText.textContent = 'Undo';
      }
    }

    // Capture every typing input accurately across mobile devices
    outputText.addEventListener('input', (e) => {
      if (isReverting) return;

      const newText = outputText.value;
      const lengthDiff = Math.abs(newText.length - currentCommittedText.length);
      const isEnterKey = (e.inputType === 'insertLineBreak' || (newText.slice(-1) === '\n'));
      const isPasteOrCut = lengthDiff > 4;

      if (isEnterKey || isPasteOrCut) {
        clearTimeout(typingTimer);
        pushToUndoStack(currentCommittedText);
        currentCommittedText = newText;
        return;
      }

      clearTimeout(typingTimer);
      typingTimer = setTimeout(() => {
        if (currentCommittedText !== newText) {
          pushToUndoStack(currentCommittedText);
          currentCommittedText = newText;
        }
      }, 500);
    });

    // Zero-Jump Viewport Undo: Replaces string without dropping viewport location
    function triggerUndo() {
      clearTimeout(typingTimer);

      if (currentCommittedText !== outputText.value) {
        pushToUndoStack(currentCommittedText);
        currentCommittedText = outputText.value;
      }

      if (undoStack.length === 0) return;

      // Lock current viewport position
      const pageScrollY = window.pageYOffset || document.documentElement.scrollTop;
      const textareaScrollTop = outputText.scrollTop;

      isReverting = true;
      const previousState = undoStack.pop();
      outputText.value = previousState;
      currentCommittedText = previousState;

      // Restore scroll positions seamlessly
      outputText.scrollTop = textareaScrollTop;
      window.scrollTo({ top: pageScrollY, behavior: 'instant' });

      requestAnimationFrame(() => {
        outputText.scrollTop = textareaScrollTop;
        window.scrollTo({ top: pageScrollY, behavior: 'instant' });
        isReverting = false;
      });

      updateUndoButton();
      showToast('Undone');
    }

    const MODELS = [
      'gemini-3.8-flash',
      'gemini-3.5-flash-lite',
      'gemini-2.5-flash'
    ];

    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    function showToast(msg) {
      toast.textContent = msg;
      toast.style.opacity = '1';
      setTimeout(() => { toast.style.opacity = '0'; }, 2400);
    }

    const wait = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'a') {
        const active = document.activeElement;
        if (active !== apiKeyInput && active !== refLyricsInput && active !== starterLineInput) {
          e.preventDefault();
          if (outputContainer.style.display !== 'none') {
            selectAllLyrics();
          }
        }
      }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && document.activeElement === outputText) {
        e.preventDefault();
        triggerUndo();
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      const savedKey = localStorage.getItem('lyria_gemini_api_key');
      const savedRefs = localStorage.getItem('lyria_reference_text');
      
      if (savedKey) apiKeyInput.value = savedKey;
      if (savedRefs) refLyricsInput.value = savedRefs;

      if (savedKey && savedRefs) {
        settingsDetails.removeAttribute('open');
      }

      renderSavedSongs();
    });

    apiKeyInput.addEventListener('input', () => {
      localStorage.setItem('lyria_gemini_api_key', apiKeyInput.value.trim());
    });
    refLyricsInput.addEventListener('input', () => {
      localStorage.setItem('lyria_reference_text', refLyricsInput.value.trim());
      localStorage.removeItem('lyria_compiled_profile');
    });

    function appendReferenceText(newText) {
      const current = refLyricsInput.value.trim();
      refLyricsInput.value = current ? `${current}\n\n${newText}` : newText;
      refLyricsInput.dispatchEvent(new Event('input'));
    }

    function getStoredSongs() {
      try {
        return JSON.parse(localStorage.getItem('lyria_saved_songs') || '[]');
      } catch (e) {
        return [];
      }
    }

    function getNextVersionTitle(baseTitle) {
      const cleanBase = baseTitle.replace(/\s*\(v\d+\)$/i, '').trim();
      const songs = getStoredSongs();
      
      const regex = new RegExp(`^${cleanBase}(?:\\s*\\(v(\\d+)\\))?$`, 'i');
      let highestVer = 0;
      let exactMatchFound = false;

      songs.forEach(s => {
        const match = s.title.match(regex);
        if (match) {
          exactMatchFound = true;
          const ver = match[1] ? parseInt(match[1], 10) : 1;
          if (ver > highestVer) highestVer = ver;
        }
      });

      if (!exactMatchFound) return cleanBase;
      return `${cleanBase} (v${highestVer + 1})`;
    }

    function saveNewVersion(baseTitle, text) {
      const uniqueTitle = getNextVersionTitle(baseTitle);
      const songs = getStoredSongs();

      const songData = {
        title: uniqueTitle,
        text: text,
        updatedAt: new Date().toISOString()
      };

      songs.unshift(songData);
      localStorage.setItem('lyria_saved_songs', JSON.stringify(songs));
      renderSavedSongs();
      currentSongTitle.textContent = uniqueTitle;
      return uniqueTitle;
    }

    function overwriteSong(title, text) {
      const songs = getStoredSongs();
      const existingIdx = songs.findIndex(s => s.title.toLowerCase() === title.toLowerCase());

      const songData = {
        title: title,
        text: text,
        updatedAt: new Date().toISOString()
      };

      if (existingIdx !== -1) {
        songs[existingIdx] = songData;
      } else {
        songs.unshift(songData);
      }

      localStorage.setItem('lyria_saved_songs', JSON.stringify(songs));
      renderSavedSongs();
      currentSongTitle.textContent = title;
      return title;
    }

    function openSaveModal() {
      const text = outputText.value.trim();
      const title = currentSongTitle.textContent.trim() || starterLineInput.value.trim() || 'Untitled';

      if (!text) {
        showToast('Nothing to save');
        return;
      }

      const songs = getStoredSongs();
      const alreadyExists = songs.some(s => s.title.toLowerCase() === title.toLowerCase());

      if (alreadyExists) {
        modalSongName.textContent = `Save "${title}"`;
        saveModalOverlay.style.display = 'flex';
      } else {
        const savedTitle = saveNewVersion(title, text);
        showToast(`Saved "${savedTitle}"`);
      }
    }

    function closeSaveModal() {
      saveModalOverlay.style.display = 'none';
    }

    function confirmSaveChoice(choice) {
      const text = outputText.value.trim();
      const title = currentSongTitle.textContent.trim() || starterLineInput.value.trim() || 'Untitled';

      closeSaveModal();

      if (choice === 'new') {
        const newTitle = saveNewVersion(title, text);
        showToast(`Saved as "${newTitle}"`);
      } else if (choice === 'overwrite') {
        overwriteSong(title, text);
        showToast(`Overwrote "${title}"`);
      }
    }

    function deleteSong(title, event) {
      event.stopPropagation();
      const confirmed = window.confirm(`Are you sure you want to delete "${title}"?`);
      if (!confirmed) return;

      let songs = getStoredSongs();
      songs = songs.filter(s => s.title !== title);
      localStorage.setItem('lyria_saved_songs', JSON.stringify(songs));
      renderSavedSongs();
      showToast(`Deleted "${title}"`);
    }

    function loadSong(song) {
      starterLineInput.value = song.title;
      currentSongTitle.textContent = song.title;
      outputText.value = song.text;
      outputContainer.style.display = 'block';
      editorFloatingBar.style.display = 'flex';
      outputContainer.scrollIntoView({ behavior: 'smooth' });

      resetHistory(song.text);
    }

    function renderSavedSongs() {
      const songs = getStoredSongs();
      songsListContainer.innerHTML = '';

      if (!songs.length) {
        songsListContainer.innerHTML = '<p id="emptyHistoryMsg" style="font-size: 0.85rem; color: var(--subtext);">No saved songs yet.</p>';
        return;
      }

      songs.forEach(song => {
        const item = document.createElement('div');
        item.className = 'history-item';
        item.onclick = () => loadSong(song);

        const name = document.createElement('span');
        name.className = 'history-title';
        name.textContent = song.title;

        const delBtn = document.createElement('button');
        delBtn.className = 'delete-item-btn';
        delBtn.textContent = '✕';
        delBtn.onclick = (e) => deleteSong(song.title, e);

        item.appendChild(name);
        item.appendChild(delBtn);
        songsListContainer.appendChild(item);
      });
    }

    async function parsePdfFile(file) {
      const typedarray = new Uint8Array(await file.arrayBuffer());
      const pdf = await pdfjsLib.getDocument(typedarray).promise;
      let fullText = '';

      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        const page = await pdf.getPage(pageNum);
        const content = await page.getTextContent();
        let lastY = null;
        let pageText = '';

        for (const item of content.items) {
          if (lastY !== null && Math.abs(item.transform[5] - lastY) > 8) {
            pageText += '\n';
          }
          pageText += item.str;
          lastY = item.transform[5];
        }
        fullText += pageText + '\n\n';
      }
      return fullText.trim();
    }

    async function handleFileUpload(event) {
      const files = Array.from(event.target.files);
      if (!files.length) return;

      showToast(`Importing ${files.length} file(s)...`);

      let combinedImportedText = '';
      let successfulCount = 0;

      for (const file of files) {
        try {
          let extractedText = '';

          if (file.type === 'text/plain') {
            extractedText = (await file.text()).trim();
          } else if (file.type === 'application/pdf') {
            extractedText = await parsePdfFile(file);
          }

          if (extractedText) {
            combinedImportedText += `\n\n--- [${file.name}] ---\n${extractedText}`;
            successfulCount++;
          }
        } catch (err) {
          console.error(`Failed reading ${file.name}:`, err);
        }
      }

      if (combinedImportedText) {
        appendReferenceText(combinedImportedText.trim());
        showToast(`Added ${successfulCount} file(s) to style corpus`);
      } else {
        showToast('Could not extract text from selected file(s)');
      }

      event.target.value = '';
    }

    async function callGemini(key, bodyPayload) {
      let lastError = null;

      for (const model of MODELS) {
        for (let attempt = 0; attempt < 2; attempt++) {
          try {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`;
            const res = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(bodyPayload)
            });

            const data = await res.json();

            if (res.status === 503 || (data.error && data.error.code === 503)) {
              await wait(1200);
              continue;
            }

            if (data.error) {
              lastError = data.error.message;
              break;
            }

            return data;
          } catch (err) {
            lastError = err.message;
            await wait(1000);
          }
        }
      }
      throw new Error(lastError || 'All models are busy. Please try again.');
    }

    async function testApiKey() {
      const key = apiKeyInput.value.trim();

      if (!key) {
        showToast('Please enter an API key to test');
        return;
      }

      testKeyBtn.textContent = '...';
      testKeyBtn.disabled = true;

      try {
        await callGemini(key, {
          contents: [{ parts: [{ text: 'ping' }] }]
        });
        showToast('API key is valid and working!');
      } catch (err) {
        showToast(`Test: ${err.message}`);
      } finally {
        testKeyBtn.textContent = 'Test';
        testKeyBtn.disabled = false;
      }
    }

    async function getOrCompileStyleProfile(key, references) {
      const cached = localStorage.getItem('lyria_compiled_profile');
      if (cached) return cached;

      generateBtn.textContent = 'Synthesizing themes & style...';

      const prompt = `Analyze these reference song lyrics and synthesize the author's lyrical identity.
Extract two clear dimensions:

1. THEMATIC DNA & SUBJECT MATTERS:
- Core themes, conflicts, and existential questions explored.
- Metaphors, sensory images, and motifs favored.
- Emotional perspective or psychological posture.

2. STRUCTURAL & RHYTHMIC FINGERPRINT:
- Cadence, line lengths, syllable pacing, and natural rhythmic meter.
- Rhyme style (slant/half rhymes, vowel resonance, internal rhymes).
- Verse-to-chorus dynamic and hook design.

CRITICAL RULE:
Summarize concepts conceptually. DO NOT copy full song lines or verbatim sentences from the source texts.

--- SONGS ---
${references}
--- END SONGS ---`;

      const data = await callGemini(key, {
        contents: [{ parts: [{ text: prompt }] }],
        generationConfig: { temperature: 0.25 }
      });

      const profile = data.candidates?.[0]?.content?.parts?.[0]?.text;
      if (profile) {
        localStorage.setItem('lyria_compiled_profile', profile);
      }
      return profile || '';
    }

    async function generateLyrics() {
      const key = apiKeyInput.value.trim();
      const starter = starterLineInput.value.trim();
      const references = refLyricsInput.value.trim();

      if (!key) {
        showToast('Add your Gemini API key in setup');
        settingsDetails.setAttribute('open', '');
        return;
      }
      if (!starter) {
        showToast('Provide an opening line or theme');
        return;
      }

      generateBtn.disabled = true;
      generateBtn.textContent = 'Starting...';
      outputContainer.style.display = 'none';
      editorFloatingBar.style.display = 'none';
      outputText.value = '';

      try {
        let styleAndThemes = '';
        if (references) {
          styleAndThemes = await getOrCompileStyleProfile(key, references);
        }

        generateBtn.textContent = 'Writing song in your voice...';

        const systemInstruction = `You are Lyria, an elite lyricist writing complete, authentic songs in this artist's distinct voice.
Structure: Standard full song progression (Verse 1, Chorus, Verse 2, Chorus, Bridge, Chorus, Outro).

ARTISTIC MISSION:
- Embody the author's emotional perspective, recurring philosophical themes, vocabulary depth, and metaphorical world described in their profile.
- Match their distinctive rhythmic cadence, line density, and rhyme craft.
- STRICT RULE ON ORIGINALITY: Write every single line, hook, and verse 100% brand-new for this prompt. Never recycle or copy past lines or catchphrases verbatim.

${styleAndThemes ? `--- ARTIST'S THEMATIC UNIVERSE & STYLE BLUEPRINT ---\n${styleAndThemes}` : ''}`;

        const data = await callGemini(key, {
          system_instruction: {
            parts: [{ text: systemInstruction }]
          },
          contents: [{
            parts: [{ text: `New song seed / opening concept: "${starter}". Write a complete, powerful original song expanding naturally from this seed.` }]
          }],
          generationConfig: {
            temperature: 0.85,
            topP: 0.95
          }
        });

        const text = data.candidates?.[0]?.content?.parts?.[0]?.text;

        if (text) {
          outputText.value = text;
          currentSongTitle.textContent = starter;
          outputContainer.style.display = 'block';
          editorFloatingBar.style.display = 'flex';
          outputContainer.scrollIntoView({ behavior: 'smooth' });

          resetHistory(text);

          const savedTitle = saveNewVersion(starter, text);
          showToast(`Saved as "${savedTitle}"`);
        } else {
          showToast('No lyrics returned.');
        }

      } catch (err) {
        showToast(`Notice: ${err.message}`);
      } finally {
        generateBtn.disabled = false;
        generateBtn.textContent = 'Generate Original Song';
      }
    }

    async function tightenLyrics() {
      const key = apiKeyInput.value.trim();
      const currentLyrics = outputText.value.trim();

      if (!key || !currentLyrics) {
        showToast('No active song to tighten');
        return;
      }

      pushToUndoStack(currentLyrics);

      tightenBtn.disabled = true;
      tightenBtn.textContent = 'Trimming excess words...';

      const prompt = `You are a master song editor. Take these lyrics and rewrite them to be punchier, shorter, and significantly less wordy.

STRICT EDITING RULES:
1. Shorten the line lengths: cut syllable counts so every line lands with rhythmic impact and immediate vocal punch.
2. Cut filler words, verbose phrasing, redundant descriptors, and conversational padding.
3. Keep the exact same song structure, section headers, rhyme schemes, and core emotional message intact.
4. Maintain the author's grit and raw poetic identity.
5. Return ONLY the tightened lyrics.

--- CURRENT LYRICS ---
${currentLyrics}
--- END CURRENT LYRICS ---`;

      try {
        const data = await callGemini(key, {
          contents: [{ parts: [{ text: prompt }] }],
          generationConfig: {
            temperature: 0.7,
            topP: 0.9
          }
        });

        const newText = data.candidates?.[0]?.content?.parts?.[0]?.text;
        if (newText) {
          outputText.value = newText;
          currentCommittedText = newText;
          showToast('Tightened! Tap Undo to revert.');
        } else {
          showToast('Could not trim lyrics.');
        }
      } catch (err) {
        showToast(`Edit failed: ${err.message}`);
      } finally {
        tightenBtn.disabled = false;
        tightenBtn.textContent = '✂️ Tighten Lines';
      }
    }

    function selectAllLyrics() {
      if (outputText.value) {
        outputText.focus();
        outputText.select();
        outputText.setSelectionRange(0, outputText.value.length);
        showToast('Lyrics selected');
      }
    }

    function copyLyrics() {
      if (!outputText.value) return;

      navigator.clipboard.writeText(outputText.value).then(() => {
        copyPillBtn.classList.add('copied');
        copyPillText.textContent = 'Copied!';
        showToast('Copied to clipboard!');

        setTimeout(() => {
          copyPillBtn.classList.remove('copied');
          copyPillText.textContent = 'Copy';
        }, 2000);
      });
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')
        .then(() => console.log('Service Worker Registered'))
        .catch((err) => console.error('SW registration failed:', err));
    }
  </script>
