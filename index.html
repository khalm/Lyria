<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#121212">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <title>Lyria</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1c1c1e;
      --text: #f0f0f0;
      --subtext: #8e8e93;
      --accent: #bb86fc;
      --accent-hover: #9a67ea;
      --border: #2c2c2e;
      --input-bg: #262628;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      padding-bottom: 40px;
      line-height: 1.5;
    }
    header {
      margin-bottom: 16px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
    }
    p.subtitle {
      font-size: 0.85rem;
      color: var(--subtext);
    }
    details {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }
    summary {
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--accent);
      user-select: none;
    }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      margin-top: 12px;
      margin-bottom: 6px;
      color: var(--subtext);
    }
    input[type="password"],
    input[type="text"],
    textarea {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: #fff;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    .key-row {
      display: flex;
      gap: 8px;
    }
    .action-btn {
      width: auto;
      margin-top: 0;
      padding: 10px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      background: #2a2a2c;
      color: var(--accent);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .action-btn:active {
      background: #333336;
    }
    .main-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
    }
    button.primary-btn {
      width: 100%;
      background-color: var(--accent);
      color: #121212;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 14px;
    }
    button.primary-btn:active {
      background-color: var(--accent-hover);
    }
    button:disabled {
      background-color: #333 !important;
      color: #666 !important;
      cursor: not-allowed;
    }
    #outputContainer {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
      display: none;
    }
    .output-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .output-header h2 {
      font-size: 1rem;
      color: var(--subtext);
    }
    .copy-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--accent);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    #outputText {
      white-space: pre-wrap;
      font-size: 0.95rem;
      color: #fff;
      line-height: 1.6;
    }
    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--input-bg);
      border: 1px solid var(--border);
      padding: 10px 12px;
      border-radius: 8px;
      margin-top: 8px;
      cursor: pointer;
    }
    .history-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 75%;
    }
    .delete-item-btn {
      background: transparent;
      border: none;
      color: #ff5c5c;
      font-size: 0.85rem;
      padding: 4px 8px;
      cursor: pointer;
    }
    #toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(30, 30, 30, 0.96);
      border: 1px solid #444;
      color: #fff;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 0.85rem;
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
      z-index: 100;
      text-align: center;
      max-width: 85%;
    }
  </style>
</head>
<body>

  <header>
    <h1>Lyria</h1>
    <p class="subtitle">AI Lyric Assistant trained on your voice</p>
  </header>

  <!-- Saved Songs Accordion -->
  <details id="historyDetails">
    <summary>📚 Saved Songs Library</summary>
    <div id="songsListContainer" style="margin-top: 10px;">
      <p id="emptyHistoryMsg" style="font-size: 0.85rem; color: var(--subtext);">No saved songs yet.</p>
    </div>
  </details>

  <!-- Setup & Style References -->
  <details id="settingsDetails" open>
    <summary>⚙️ Setup & Style References</summary>
    
    <label for="apiKey">Gemini API Key</label>
    <div class="key-row">
      <input type="password" id="apiKey" placeholder="AI Studio Key">
      <button type="button" id="testKeyBtn" class="action-btn" onclick="testApiKey()">Test</button>
    </div>

    <label for="referenceLyrics">Reference Songs / Past Lyrics (Raw Sources)</label>
    
    <div style="margin-bottom: 8px;">
      <input type="file" id="fileInput" accept="application/pdf, text/plain" multiple style="display: none;" onchange="handleFileUpload(event)">
      <button type="button" class="action-btn" style="width: 100%;" onclick="document.getElementById('fileInput').click()">
        📄 Import Multiple PDFs / Text Files
      </button>
    </div>

    <textarea id="referenceLyrics" rows="8" placeholder="Paste full songs, verses, or import multiple PDFs/text files."></textarea>
  </details>

  <!-- Input Area -->
  <div class="main-card">
    <label for="starterLine" style="margin-top: 0;">Opening Line or Theme (Song Title)</label>
    <input type="text" id="starterLine" placeholder="e.g. Iron string buzzing on the twelfth fret">

    <button id="generateBtn" class="primary-btn" onclick="generateLyrics()">Generate Original Song</button>
  </div>

  <!-- Output Area -->
  <div id="outputContainer">
    <div class="output-header">
      <h2 id="currentSongTitle">Generated Lyrics</h2>
      <button class="copy-btn" onclick="copyLyrics()">Copy Text</button>
    </div>
    <div id="outputText"></div>
  </div>

  <div id="toast"></div>

  <script>
    const apiKeyInput = document.getElementById('apiKey');
    const refLyricsInput = document.getElementById('referenceLyrics');
    const starterLineInput = document.getElementById('starterLine');
    const outputContainer = document.getElementById('outputContainer');
    const outputText = document.getElementById('outputText');
    const currentSongTitle = document.getElementById('currentSongTitle');
    const generateBtn = document.getElementById('generateBtn');
    const testKeyBtn = document.getElementById('testKeyBtn');
    const settingsDetails = document.getElementById('settingsDetails');
    const songsListContainer = document.getElementById('songsListContainer');
    const toast = document.getElementById('toast');

    const MODELS = [
      'gemini-3.8-flash',
      'gemini-3.5-flash-lite',
      'gemini-2.5-flash'
    ];

    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    function showToast(msg) {
      toast.textContent = msg;
      toast.style.opacity = '1';
      setTimeout(() => { toast.style.opacity = '0'; }, 3000);
    }

    const wait = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    window.addEventListener('DOMContentLoaded', () => {
      const savedKey = localStorage.getItem('lyria_gemini_api_key');
      const savedRefs = localStorage.getItem('lyria_reference_text');
      
      if (savedKey) apiKeyInput.value = savedKey;
      if (savedRefs) refLyricsInput.value = savedRefs;

      if (savedKey && savedRefs) {
        settingsDetails.removeAttribute('open');
      }

      renderSavedSongs();
    });

    apiKeyInput.addEventListener('input', () => {
      localStorage.setItem('lyria_gemini_api_key', apiKeyInput.value.trim());
    });
    refLyricsInput.addEventListener('input', () => {
      localStorage.setItem('lyria_reference_text', refLyricsInput.value.trim());
      localStorage.removeItem('lyria_compiled_profile');
    });

    function appendReferenceText(newText) {
      const current = refLyricsInput.value.trim();
      refLyricsInput.value = current ? `${current}\n\n${newText}` : newText;
      refLyricsInput.dispatchEvent(new Event('input'));
    }

    function getStoredSongs() {
      try {
        return JSON.parse(localStorage.getItem('lyria_saved_songs') || '[]');
      } catch (e) {
        return [];
      }
    }

    function saveSongToStorage(title, text) {
      const songs = getStoredSongs();
      const existingIdx = songs.findIndex(s => s.title.toLowerCase() === title.toLowerCase());
      
      const songData = {
        title: title,
        text: text,
        updatedAt: new Date().toISOString()
      };

      if (existingIdx !== -1) {
        songs[existingIdx] = songData;
      } else {
        songs.unshift(songData);
      }

      localStorage.setItem('lyria_saved_songs', JSON.stringify(songs));
      renderSavedSongs();
    }

    function deleteSong(title, event) {
      event.stopPropagation();
      let songs = getStoredSongs();
      songs = songs.filter(s => s.title !== title);
      localStorage.setItem('lyria_saved_songs', JSON.stringify(songs));
      renderSavedSongs();
      showToast(`Removed "${title}"`);
    }

    function loadSong(song) {
      starterLineInput.value = song.title;
      currentSongTitle.textContent = song.title;
      outputText.textContent = song.text;
      outputContainer.style.display = 'block';
      outputContainer.scrollIntoView({ behavior: 'smooth' });
    }

    function renderSavedSongs() {
      const songs = getStoredSongs();
      songsListContainer.innerHTML = '';

      if (!songs.length) {
        songsListContainer.innerHTML = '<p id="emptyHistoryMsg" style="font-size: 0.85rem; color: var(--subtext);">No saved songs yet.</p>';
        return;
      }

      songs.forEach(song => {
        const item = document.createElement('div');
        item.className = 'history-item';
        item.onclick = () => loadSong(song);

        const name = document.createElement('span');
        name.className = 'history-title';
        name.textContent = song.title;

        const delBtn = document.createElement('button');
        delBtn.className = 'delete-item-btn';
        delBtn.textContent = '✕';
        delBtn.onclick = (e) => deleteSong(song.title, e);

        item.appendChild(name);
        item.appendChild(delBtn);
        songsListContainer.appendChild(item);
      });
    }

    async function parsePdfFile(file) {
      const typedarray = new Uint8Array(await file.arrayBuffer());
      const pdf = await pdfjsLib.getDocument(typedarray).promise;
      let fullText = '';

      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        const page = await pdf.getPage(pageNum);
        const content = await page.getTextContent();
        let lastY = null;
        let pageText = '';

        for (const item of content.items) {
          if (lastY !== null && Math.abs(item.transform[5] - lastY) > 8) {
            pageText += '\n';
          }
          pageText += item.str;
          lastY = item.transform[5];
        }
        fullText += pageText + '\n\n';
      }
      return fullText.trim();
    }

    async function handleFileUpload(event) {
      const files = Array.from(event.target.files);
      if (!files.length) return;

      showToast(`Importing ${files.length} file(s)...`);

      let combinedImportedText = '';
      let successfulCount = 0;

      for (const file of files) {
        try {
          let extractedText = '';

          if (file.type === 'text/plain') {
            extractedText = (await file.text()).trim();
          } else if (file.type === 'application/pdf') {
            extractedText = await parsePdfFile(file);
          }

          if (extractedText) {
            combinedImportedText += `\n\n--- [${file.name}] ---\n${extractedText}`;
            successfulCount++;
          }
        } catch (err) {
          console.error(`Failed reading ${file.name}:`, err);
        }
      }

      if (combinedImportedText) {
        appendReferenceText(combinedImportedText.trim());
        showToast(`Added ${successfulCount} file(s) to style corpus`);
      } else {
        showToast('Could not extract text from selected file(s)');
      }

      event.target.value = '';
    }

    async function callGemini(key, bodyPayload) {
      let lastError = null;

      for (const model of MODELS) {
        for (let attempt = 0; attempt < 2; attempt++) {
          try {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`;
            const res = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(bodyPayload)
            });

            const data = await res.json();

            if (res.status === 503 || (data.error && data.error.code === 503)) {
              await wait(1200);
              continue;
            }

            if (data.error) {
              lastError = data.error.message;
              break;
            }

            return data;
          } catch (err) {
            lastError = err.message;
            await wait(1000);
          }
        }
      }
      throw new Error(lastError || 'All models are busy. Please try again.');
    }

    async function testApiKey() {
      const key = apiKeyInput.value.trim();

      if (!key) {
        showToast('Please enter an API key to test');
        return;
      }

      testKeyBtn.textContent = '...';
      testKeyBtn.disabled = true;

      try {
        await callGemini(key, {
          contents: [{ parts: [{ text: 'ping' }] }]
        });
        showToast('API key is valid and working!');
      } catch (err) {
        showToast(`Test: ${err.message}`);
      } finally {
        testKeyBtn.textContent = 'Test';
        testKeyBtn.disabled = false;
      }
    }

    // Step 1: Synthesize both Style Fingerprint AND Thematic DNA
    async function getOrCompileStyleProfile(key, references) {
      const cached = localStorage.getItem('lyria_compiled_profile');
      if (cached) return cached;

      generateBtn.textContent = 'Synthesizing themes & style...';

      const prompt = `Analyze these reference song lyrics and synthesize the author's lyrical identity.
Extract two clear dimensions:

1. THEMATIC DNA & SUBJECT MATTERS:
- What core themes, conflicts, and existential questions does this writer frequently explore? (e.g. rebirth, inner friction, mortality, autonomy, disillusionment, resilience)
- What types of metaphors, sensory images, and motifs do they gravitate towards? (e.g. biological terms, physical ruin, decay vs growth, industrial vs natural imagery)
- What emotional perspective or psychological posture do their songs embody?

2. STRUCTURAL & RHYTHMIC FINGERPRINT:
- Cadence, line lengths, syllable pacing, and natural rhythmic meter.
- Rhyme style (preference for internal rhymes, slant/half rhymes, vowel resonance, or direct end rhymes).
- Verse-to-chorus dynamic and hook design.

CRITICAL RULE:
Summarize concepts, recurring themes, and stylistic rules conceptually. DO NOT copy or include full song verses, chorus lines, or verbatim sentences from the source texts.

--- SONGS ---
${references}
--- END SONGS ---`;

      const data = await callGemini(key, {
        contents: [{ parts: [{ text: prompt }] }],
        generationConfig: { temperature: 0.25 }
      });

      const profile = data.candidates?.[0]?.content?.parts?.[0]?.text;
      if (profile) {
        localStorage.setItem('lyria_compiled_profile', profile);
      }
      return profile || '';
    }

    // Step 2: Write fresh lyrics embodying the themes and style
    async function generateLyrics() {
      const key = apiKeyInput.value.trim();
      const starter = starterLineInput.value.trim();
      const references = refLyricsInput.value.trim();

      if (!key) {
        showToast('Add your Gemini API key in setup');
        settingsDetails.setAttribute('open', '');
        return;
      }
      if (!starter) {
        showToast('Provide an opening line or theme');
        return;
      }

      generateBtn.disabled = true;
      generateBtn.textContent = 'Starting...';
      outputContainer.style.display = 'none';
      outputText.textContent = '';

      try {
        let styleAndThemes = '';
        if (references) {
          styleAndThemes = await getOrCompileStyleProfile(key, references);
        }

        generateBtn.textContent = 'Writing song in your voice...';

        const systemInstruction = `You are Lyria, an elite lyricist writing complete, authentic songs in this artist's distinct voice.
Structure: Standard full song progression (Verse 1, Chorus, Verse 2, Chorus, Bridge, Chorus, Outro).

ARTISTIC MISSION:
- Embody the author's emotional perspective, recurring philosophical themes, vocabulary depth, and metaphorical world described in their profile.
- Match their distinctive rhythmic cadence, line density, and rhyme craft.
- STRICT RULE ON ORIGINALITY: Write every single line, hook, and verse 100% brand-new for this prompt. Never recycle or copy past lines or catchphrases verbatim. Express their signature themes through completely fresh imagery and scenarios.

${styleAndThemes ? `--- ARTIST'S THEMATIC UNIVERSE & STYLE BLUEPRINT ---\n${styleAndThemes}` : ''}`;

        const data = await callGemini(key, {
          system_instruction: {
            parts: [{ text: systemInstruction }]
          },
          contents: [{
            parts: [{ text: `New song seed / opening concept: "${starter}". Write a complete, powerful original song that belongs in this artist's catalog, expanding naturally from this seed.` }]
          }],
          generationConfig: {
            temperature: 0.85,
            topP: 0.95
          }
        });

        const text = data.candidates?.[0]?.content?.parts?.[0]?.text;

        if (text) {
          outputText.textContent = text;
          currentSongTitle.textContent = starter;
          outputContainer.style.display = 'block';
          outputContainer.scrollIntoView({ behavior: 'smooth' });

          saveSongToStorage(starter, text);
          showToast(`Saved "${starter}" to library`);
        } else {
          showToast('No lyrics returned.');
        }

      } catch (err) {
        showToast(`Notice: ${err.message}`);
      } finally {
        generateBtn.disabled = false;
        generateBtn.textContent = 'Generate Original Song';
      }
    }

    function copyLyrics() {
      navigator.clipboard.writeText(outputText.textContent).then(() => {
        showToast('Copied to clipboard!');
      });
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')
        .then(() => console.log('Service Worker Registered'))
        .catch((err) => console.error('SW registration failed:', err));
    }
  </script>
</body>
</html>
