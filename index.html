<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#121212">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <title>Lyria</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1c1c1e;
      --text: #f0f0f0;
      --subtext: #8e8e93;
      --accent: #bb86fc;
      --accent-hover: #9a67ea;
      --border: #2c2c2e;
      --input-bg: #262628;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      padding-bottom: 40px;
      line-height: 1.5;
    }
    header {
      margin-bottom: 16px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
    }
    p.subtitle {
      font-size: 0.85rem;
      color: var(--subtext);
    }
    details {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }
    summary {
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--accent);
      user-select: none;
    }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      margin-top: 12px;
      margin-bottom: 6px;
      color: var(--subtext);
    }
    input[type="password"],
    input[type="text"],
    textarea {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: #fff;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    .key-row {
      display: flex;
      gap: 8px;
    }
    .action-btn {
      width: auto;
      margin-top: 0;
      padding: 10px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      background: #2a2a2c;
      color: var(--accent);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .action-btn:active {
      background: #333336;
    }
    .main-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
    }
    button.primary-btn {
      width: 100%;
      background-color: var(--accent);
      color: #121212;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 14px;
    }
    button.primary-btn:active {
      background-color: var(--accent-hover);
    }
    button:disabled {
      background-color: #333 !important;
      color: #666 !important;
      cursor: not-allowed;
    }
    #outputContainer {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
      display: none;
    }
    .output-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .output-header h2 {
      font-size: 1rem;
      color: var(--subtext);
    }
    .copy-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--accent);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    #outputText {
      white-space: pre-wrap;
      font-size: 0.95rem;
      color: #fff;
      line-height: 1.6;
    }
    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--input-bg);
      border: 1px solid var(--border);
      padding: 10px 12px;
      border-radius: 8px;
      margin-top: 8px;
      cursor: pointer;
    }
    .history-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 75%;
    }
    .delete-item-btn {
      background: transparent;
      border: none;
      color: #ff5c5c;
      font-size: 0.85rem;
      padding: 4px 8px;
      cursor: pointer;
    }
    #toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(30, 30, 30, 0.96);
      border: 1px solid #444;
      color: #fff;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 0.85rem;
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
      z-index: 100;
      text-align: center;
      max-width: 85%;
    }
  </style>
</head>
<body>

  <header>
    <h1>Lyria</h1>
    <p class="subtitle">AI Lyric Assistant trained on your voice</p>
  </header>

  <!-- Saved Songs Accordion -->
  <details id="historyDetails">
    <summary>📚 Saved Songs Library</summary>
    <div id="songsListContainer" style="margin-top: 10px;">
      <p id="emptyHistoryMsg" style="font-size: 0.85rem; color: var(--subtext);">No saved songs yet.</p>
    </div>
  </details>

  <!-- Setup & Style References -->
  <details id="settingsDetails" open>
    <summary>⚙️ Setup & Style References</summary>
    
    <label for="apiKey">Gemini API Key</label>
    <div class="key-row">
      <input type="password" id="apiKey" placeholder="AI Studio Key">
      <button type="button" id="testKeyBtn" class="action-btn" onclick="testApiKey()">Test</button>
    </div>

    <label for="referenceLyrics">Reference Songs / Past Lyrics (Style Guide)</label>
    
    <div style="margin-bottom: 8px;">
      <input type="file" id="fileInput" accept="application/pdf, text/plain" multiple style="display: none;" onchange="handleFileUpload(event)">
      <button type="button" class="action-btn" style="width: 100%;" onclick="document.getElementById('fileInput').click()">
        📄 Import Multiple PDFs / Text Files
      </button>
    </div>

    <textarea id="referenceLyrics" rows="8" placeholder="Paste full songs, verses, or import multiple PDFs/text files. Lyria will learn your meter, vocabulary, rhyme density, and tone."></textarea>
  </details>

  <!-- Input Area -->
  <div class="main-card">
    <label for="starterLine" style="margin-top: 0;">Opening Line or Theme (Song Title)</label>
    <input type="text" id="starterLine" placeholder="e.g. Iron string buzzing on the twelfth fret">

    <button id="generateBtn" class="primary-btn" onclick="generateLyrics()">Generate Lyrics</button>
  </div>

  <!-- Output Area -->
  <div id="outputContainer">
    <div class="output-header">
      <h2 id="currentSongTitle">Generated Lyrics</h2>
      <button class="copy-btn" onclick="copyLyrics()">Copy Text</button>
    </div>
    <div id="outputText"></div>
  </div>

  <div id="toast"></div>

  <script>
    const apiKeyInput = document.getElementById('apiKey');
    const refLyricsInput = document.getElementById('referenceLyrics');
    const starterLineInput = document.getElementById('starterLine');
    const outputContainer = document.getElementById('outputContainer');
    const outputText = document.getElementById('outputText');
    const currentSongTitle = document.getElementById('currentSongTitle');
    const generateBtn = document.getElementById('generateBtn');
    const testKeyBtn = document.getElementById('testKeyBtn');
    const settingsDetails = document.getElementById('settingsDetails');
    const songsListContainer = document.getElementById('songsListContainer');
    const toast = document.getElementById('toast');

    const MODELS = [
      'gemini-3.8-flash',
      'gemini-2.5-flash',
      'gemini-2.0-flash-lite'
    ];

    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    function showToast(msg) {
      toast.textContent = msg;
      toast.style.opacity = '1';
      setTimeout(() => { toast.style.opacity = '0'; }, 3000);
    }

    const wait = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    // Load saved settings & song history
    window.addEventListener('DOMContentLoaded', () => {
      const savedKey = localStorage.getItem('lyria_gemini_api_key');
      const savedRefs = localStorage.getItem('lyria_reference_text');
      
      if (savedKey) apiKeyInput.value = savedKey;
      if (savedRefs) refLyricsInput.value = savedRefs;

      if (savedKey && savedRefs) {
        settingsDetails.removeAttribute('open');
      }

      renderSavedSongs();
    });

    // Auto-save settings
    apiKeyInput.addEventListener('input', () => {
      localStorage.setItem('lyria_gemini_api_key', apiKeyInput.value.trim());
    });
    refLyricsInput.addEventListener('input', () => {
      localStorage.setItem('lyria_reference_text', refLyricsInput.value.trim());
    });

    function appendReferenceText(newText) {
      const current = refLyricsInput.value.trim();
      refLyricsInput.value = current ? `${current}\n\n${newText}` : newText;
      refLyricsInput.dispatchEvent(new Event('input'));
    }

    // Song library storage
    function getStoredSongs() {
      try {
        return JSON.parse(localStorage.getItem('lyria_saved_songs') || '[]');
      } catch (e) {
        return [];
      }
    }

    function saveSongToStorage(title, text) {
      const songs = getStoredSongs();
      const existingIdx = songs.findIndex(s => s.title.toLowerCase() === title.toLowerCase());
      
      const songData = {
        title: title,
        text: text,
        updatedAt: new Date().toISOString()
      };

      if (existingIdx !== -1) {
        songs[existingIdx] = songData;
      } else {
        songs.unshift(songData);
      }

      localStorage.setItem('lyria_saved_songs', JSON.stringify(songs));
      renderSavedSongs();
    }

    function deleteSong(title, event) {
      event.stopPropagation();
      let songs = getStoredSongs();
      songs = songs.filter(s => s.title !== title);
      localStorage.setItem('lyria_saved_songs', JSON.stringify(songs));
      renderSavedSongs();
      showToast(`Removed "${title}"`);
    }

    function loadSong(song) {
      starterLineInput.value = song.title;
      currentSongTitle.textContent = song.title;
      outputText.textContent = song.text;
      outputContainer.style.display = 'block';
      outputContainer.scrollIntoView({ behavior: 'smooth' });
    }

    function renderSavedSongs() {
      const songs = getStoredSongs();
      songsListContainer.innerHTML = '';

      if (!songs.length) {
        songsListContainer.innerHTML = '<p id="emptyHistoryMsg" style="font-size: 0.85rem; color: var(--subtext);">No saved songs yet.</p>';
        return;
      }

      songs.forEach(song => {
        const item = document.createElement('div');
        item.className = 'history-item';
        item.onclick = () => loadSong(song);

        const name = document.createElement('span');
        name.className = 'history-title';
        name.textContent = song.title;

        const delBtn = document.createElement('button');
        delBtn.className = 'delete-item-btn';
        delBtn.textContent = '✕';
        delBtn.onclick = (e) => deleteSong(song.title, e);

        item.appendChild(name);
        item.appendChild(delBtn);
        songsListContainer.appendChild(item);
      });
    }

    // PDF parsing
    async function parsePdfFile(file) {
      const typedarray = new Uint8Array(await file.arrayBuffer());
      const pdf = await pdfjsLib.getDocument(typedarray).promise;
      let fullText = '';

      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        const page = await pdf.getPage(pageNum);
        const content = await page.getTextContent();
        let lastY = null;
        let pageText = '';

        for (const item of content.items) {
          if (lastY !== null && Math.abs(item.transform[5] - lastY) > 8) {
            pageText += '\n';
          }
          pageText += item.str;
          lastY = item.transform[5];
        }
        fullText += pageText + '\n\n';
      }
      return fullText.trim();
    }

    async function handleFileUpload(event) {
      const files = Array.from(event.target.files);
      if (!files.length) return;

      showToast(`Importing ${files.length} file(s)...`);

      let combinedImportedText = '';
      let successfulCount = 0;

      for (const file of files) {
        try {
          let extractedText = '';

          if (file.type === 'text/plain') {
            extractedText = (await file.text()).trim();
          } else if (file.type === 'application/pdf') {
            extractedText = await parsePdfFile(file);
          }

          if (extractedText) {
            combinedImportedText += `\n\n--- [${file.name}] ---\n${extractedText}`;
            successfulCount++;
          }
        } catch (err) {
          console.error(`Failed reading ${file.name}:`, err);
        }
      }

      if (combinedImportedText) {
        appendReferenceText(combinedImportedText.trim());
        showToast(`Added ${successfulCount} file(s) to style corpus`);
      } else {
        showToast('Could not extract text from selected file(s)');
      }

      event.target.value = '';
    }

    // Call API with fallback support
    async function callGemini(key, bodyPayload) {
      let lastError = null;

      for (const model of MODELS) {
        for (let attempt = 0; attempt < 2; attempt++) {
          try {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`;
            const res = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(bodyPayload)
            });

            const data = await res.json();

            if (res.status === 503 || (data.error && data.error.code === 503)) {
              await wait(1200);
              continue;
            }

            if (data.error) {
              lastError = data.error.message;
              break;
            }

            return data;
          } catch (err) {
            lastError = err.message;
            await wait(1000);
          }
        }
      }
      throw new Error(lastError || 'All models are currently experiencing high demand. Please try again in a moment.');
    }

    // Verify API Key
    async function testApiKey() {
      const key = apiKeyInput.value.trim();

      if (!key) {
        showToast('Please enter an API key to test');
        return;
      }

      testKeyBtn.textContent = '...';
      testKeyBtn.disabled = true;

      try {
        await callGemini(key, {
          contents: [{ parts: [{ text: 'ping' }] }]
        });
        showToast('API key is valid and working!');
      } catch (err) {
        showToast(`Test: ${err.message}`);
      } finally {
        testKeyBtn.textContent = 'Test';
        testKeyBtn.disabled = false;
      }
    }

    // Generate Lyrics
    async function generateLyrics() {
      const key = apiKeyInput.value.trim();
      const starter = starterLineInput.value.trim();
      const references = refLyricsInput.value.trim();

      if (!key) {
        showToast('Add your Gemini API key in setup');
        settingsDetails.setAttribute('open', '');
        return;
      }
      if (!starter) {
        showToast('Provide an opening line or theme');
        return;
      }

      let systemInstruction = "You are Lyria, an elite lyricist and songwriting collaborator. Write full, cohesive song lyrics with clear structure (Verse 1, Chorus, Verse 2, Chorus, Bridge, Chorus, Outro). Prioritize natural rhythmic meter, distinct line cadence, and intentional rhyming.";
      
      if (references) {
        systemInstruction += `\n\nCRITICAL DIRECTIVE - STYLE EXTRACTION ONLY (DO NOT REUSE):\nAnalyze the provided reference lyrics ONLY to understand the author's stylistic DNA:\n1. Metrics and meter (syllable counts, rhythmic pulse, line lengths)\n2. Phrasing cadence and structural tendencies (e.g. repeated refrains, hook placement)\n3. Rhyme mechanisms (preference for slant rhymes, internal rhymes, vowel assonance, or exact rhymes)\n4. Tonality and vocabulary tier (grit, imagery type, philosophical depth, emotional weight)\n\nSTRICT ANTI-PLAGIARISM RULE:\nDo NOT copy, recycle, paraphrase, or reuse any specific lines, verses, hooks, distinct catchphrases, or exact wording from the reference lyrics. Every single line in your generated response must be 100% original and written from scratch, matching ONLY the rhythmic and artistic fingerprints of the author.\n\n--- STYLE FINGERPRINT REFERENCES ---\n${references}\n--- END REFERENCES ---`;
      }

      generateBtn.disabled = true;
      generateBtn.textContent = 'Writing...';
      outputContainer.style.display = 'none';
      outputText.textContent = '';

      try {
        const data = await callGemini(key, {
          system_instruction: {
            parts: [{ text: systemInstruction }]
          },
          contents: [{
            parts: [{ text: `Starting line or theme: "${starter}". Complete a completely original song in the learned style building directly from this concept.` }]
          }],
          generationConfig: {
            temperature: 0.85,
            topP: 0.95
          }
        });

        const text = data.candidates?.[0]?.content?.parts?.[0]?.text;

        if (text) {
          outputText.textContent = text;
          currentSongTitle.textContent = starter;
          outputContainer.style.display = 'block';
          outputContainer.scrollIntoView({ behavior: 'smooth' });

          // Automatically save song using the prompt title
          saveSongToStorage(starter, text);
          showToast(`Saved "${starter}" to library`);
        } else {
          showToast('No lyrics returned.');
        }

      } catch (err) {
        showToast(`Notice: ${err.message}`);
      } finally {
        generateBtn.disabled = false;
        generateBtn.textContent = 'Generate Lyrics';
      }
    }

    function copyLyrics() {
      navigator.clipboard.writeText(outputText.textContent).then(() => {
        showToast('Copied to clipboard!');
      });
    }

    // Register Service Worker for PWA installation
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')
        .then(() => console.log('Service Worker Registered'))
        .catch((err) => console.error('SW registration failed:', err));
    }
  </script>
</body>
</html>
