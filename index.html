<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#121212">
  <title>Lyric Assistant</title>
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --text: #e0e0e0;
      --accent: #bb86fc;
      --accent-hover: #9a67ea;
      --border: #333333;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      line-height: 1.5;
    }
    header {
      margin-bottom: 20px;
    }
    h1 {
      font-size: 1.4rem;
      color: #ffffff;
      margin-bottom: 4px;
    }
    p.subtitle {
      font-size: 0.85rem;
      color: #999;
    }
    details {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
    }
    summary {
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--accent);
    }
    label {
      display: block;
      font-size: 0.8rem;
      margin-top: 10px;
      margin-bottom: 4px;
      color: #bbb;
    }
    input[type="password"],
    input[type="text"],
    textarea {
      width: 100%;
      background: #2a2a2a;
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.95rem;
    }
    input:focus, textarea:focus {
      outline: 1px solid var(--accent);
      border-color: var(--accent);
    }
    textarea {
      resize: vertical;
    }
    .main-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }
    button {
      width: 100%;
      background-color: var(--accent);
      color: #000;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 14px;
      transition: background 0.2s;
    }
    button:active {
      background-color: var(--accent-hover);
    }
    button:disabled {
      background-color: #555;
      color: #888;
      cursor: not-allowed;
    }
    #outputContainer {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      display: none;
    }
    #outputText {
      white-space: pre-wrap;
      font-family: inherit;
      font-size: 0.95rem;
      color: #fff;
      margin-top: 10px;
    }
    .copy-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--accent);
      padding: 6px 12px;
      font-size: 0.8rem;
      width: auto;
      margin-top: 0;
      float: right;
    }
  </style>
</head>
<body>

  <header>
    <h1>Lyric Assistant</h1>
    <p class="subtitle">Complete songs shaped to your personal style</p>
  </header>

  <!-- Settings Accordion -->
  <details id="settingsDetails" open>
    <summary>⚙️ Setup & Style References</summary>
    
    <label for="apiKey">Gemini API Key</label>
    <input type="password" id="apiKey" placeholder="Paste your AI Studio API key here">

    <label for="referenceLyrics">Reference Songs / Past Lyrics (Style Guide)</label>
    <textarea id="referenceLyrics" rows="6" placeholder="Paste fragments or full songs you wrote previously. The AI will match their meter, rhyme density, and tone."></textarea>
  </details>

  <!-- Input Area -->
  <div class="main-card">
    <label for="starterLine" style="margin-top: 0;">Opening Line or Theme</label>
    <input type="text" id="starterLine" placeholder="e.g. Broken clock ticking on the wooden wall">

    <button id="generateBtn" onclick="generateLyrics()">Complete the Song</button>
  </div>

  <!-- Output Area -->
  <div id="outputContainer">
    <button class="copy-btn" onclick="copyLyrics()">Copy</button>
    <h2 style="font-size: 1rem; color: #bbb;">Generated Lyrics</h2>
    <div id="outputText"></div>
  </div>

  <script>
    const apiKeyInput = document.getElementById('apiKey');
    const refLyricsInput = document.getElementById('referenceLyrics');
    const starterLineInput = document.getElementById('starterLine');
    const outputContainer = document.getElementById('outputContainer');
    const outputText = document.getElementById('outputText');
    const generateBtn = document.getElementById('generateBtn');
    const settingsDetails = document.getElementById('settingsDetails');

    // Load saved settings from browser localStorage
    window.addEventListener('DOMContentLoaded', () => {
      const savedKey = localStorage.getItem('lyric_gemini_api_key');
      const savedRefs = localStorage.getItem('lyric_reference_text');
      
      if (savedKey) apiKeyInput.value = savedKey;
      if (savedRefs) refLyricsInput.value = savedRefs;

      // Auto-collapse settings if both key and references are already set
      if (savedKey && savedRefs) {
        settingsDetails.removeAttribute('open');
      }
    });

    // Auto-save on change
    apiKeyInput.addEventListener('input', () => {
      localStorage.setItem('lyric_gemini_api_key', apiKeyInput.value.trim());
    });
    refLyricsInput.addEventListener('input', () => {
      localStorage.setItem('lyric_reference_text', refLyricsInput.value.trim());
    });

    async function generateLyrics() {
      const key = apiKeyInput.value.trim();
      const starter = starterLineInput.value.trim();
      const references = refLyricsInput.value.trim();

      if (!key) {
        alert('Please enter your Gemini API key in the Setup section.');
        settingsDetails.setAttribute('open', '');
        return;
      }
      if (!starter) {
        alert('Please provide an opening line or theme.');
        return;
      }

      // Build system prompt based on whether reference songs exist
      let systemInstruction = "You are a master lyricist and songwriter. When given an opening line, complete a full, cohesive song structure (e.g., Verse 1, Chorus, Verse 2, Chorus, Bridge, Chorus, Outro). Prioritize natural rhythmic meter, distinct cadences, and intentional rhyming schemes.";
      
      if (references) {
        systemInstruction += `\n\nCRITICAL INSTRUCTION - STYLE MATCHING:\nAnalyze and mirror the poetic identity, vocabulary, rhyming density, and thematic tone of the following reference songs written by the user:\n--- BEGIN REFERENCE SONGS ---\n${references}\n--- END REFERENCE SONGS ---`;
      }

      generateBtn.disabled = true;
      generateBtn.textContent = 'Writing lyrics...';
      outputContainer.style.display = 'none';
      outputText.textContent = '';

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            system_instruction: {
              parts: [{ text: systemInstruction }]
            },
            contents: [{
              parts: [{ text: `Here is my starting line/theme: "${starter}". Please write the rest of the song expanding on this, starting directly with or from this line.` }]
            }],
            generationConfig: {
              temperature: 0.75
            }
          })
        });

        const data = await response.json();

        if (data.error) {
          alert('API Error: ' + data.error.message);
          return;
        }

        const candidate = data.candidates?.[0];
        const text = candidate?.content?.parts?.[0]?.text;

        if (text) {
          outputText.textContent = text;
          outputContainer.style.display = 'block';
          outputContainer.scrollIntoView({ behavior: 'smooth' });
        } else {
          alert('No lyrics returned. Please check your prompt or API status.');
        }

      } catch (err) {
        alert('Request failed: ' + err.message);
      } finally {
        generateBtn.disabled = false;
        generateBtn.textContent = 'Complete the Song';
      }
    }

    function copyLyrics() {
      navigator.clipboard.writeText(outputText.textContent).then(() => {
        alert('Lyrics copied to clipboard!');
      });
    }
  </script>
</body>
</html>
